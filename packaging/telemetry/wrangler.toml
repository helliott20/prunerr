name = "prunerr-telemetry"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Cloudflare hands out a free <name>.<subdomain>.workers.dev hostname, so this
# needs no domain purchase. Add a `routes` entry instead if you'd rather serve
# it from your own domain.
workers_dev = true

# Daily maintenance: record the day's count, prune installs past retention.
[triggers]
crons = ["20 4 * * *"]

# Already created, with the schema applied. A database_id is an identifier,
# not a credential — it is useless without account access, which is why
# Cloudflare's own examples commit it.
[[d1_databases]]
binding = "DB"
database_name = "prunerr-telemetry"
database_id = "2ca93999-19ca-492d-a87a-7e0526ed6c20"

# The "What's new" feed and its images. Create the namespace once with
#   npx wrangler kv namespace create ANNOUNCEMENTS
# and paste the id it prints below. Writes also need the admin token:
#   npx wrangler secret put ADMIN_TOKEN
[[kv_namespaces]]
binding = "ANNOUNCEMENTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Request logs would defeat the point of not storing IPs, so they stay off.
# (This is the default; it is stated explicitly so a future edit has to be
# deliberate.)
[observability]
enabled = false
